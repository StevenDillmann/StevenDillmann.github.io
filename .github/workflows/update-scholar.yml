name: Refresh Google Scholar citations
# Refreshes Scholar data every ~3 days, fetching through SerpApi (SERPAPI_KEY secret) because
# Scholar blocks most GitHub servers. Checks every 2 hours: once the data is over 60 hours old it
# fetches, commits the cache and redeploys; if a fetch fails, the next check retries. Runs exit in
# seconds while the data is fresh. "Run workflow" (manual) always fetches.

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # needed to start the deploy workflow

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the data is due for a refresh
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          file=$(ls _cache/scholar_*.json | grep -v scholar_pubs_ | head -1)
          fetched=$(jq -r '.fetched_at // empty' "$file" 2>/dev/null || true)
          age_h=$(( ( $(date +%s) - $(date -d "${fetched:-1970-01-01}" +%s) ) / 3600 ))
          echo "Scholar data is ${age_h}h old."
          if [ "$age_h" -ge 60 ]; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "Still fresh; skipping."; fi

      - name: Set up Ruby
        if: steps.due.outputs.due == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        if: steps.due.outputs.due == 'true'
        run: bundle install --jobs 4 --retry 3

      - name: Build site (fetches fresh Scholar data)
        id: build
        if: steps.due.outputs.due == 'true'
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          SCHOLAR_REFRESH: "1"
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }} # fetch through SerpApi, which Scholar doesn't block
        run: |
          set -o pipefail
          if [ -n "$SERPAPI_KEY" ]; then echo "Using SerpApi (key is set)."; else echo "::warning::SERPAPI_KEY secret is empty; reading Scholar directly."; fi
          bundle exec jekyll build 2>&1 | tee build.log
          if grep -q "Warning: Failed to fetch" build.log; then
            echo "::warning::Google Scholar blocked this server; nothing saved, a later run will retry."
            git checkout -- _cache/
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated Scholar cache
        id: commit
        if: steps.build.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _cache/
          if git diff --staged --quiet; then
            echo "No citation-related changes to commit."
          else
            git commit -m "chore: refresh Google Scholar cache"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      # pages.yml is the workflow that publishes the site (GitHub Pages is in "workflow" mode).
      - name: Redeploy site with the new data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
