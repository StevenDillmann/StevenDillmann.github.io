name: Refresh Google Scholar citations
# Runs daily (and manually via "Run workflow"): fetches fresh Scholar data, commits the
# cache, then redeploys the site. If Scholar blocks the request, the last good cache is kept.

on:
  schedule:
    - cron: "0 10 * * *" # daily at 10:00 UTC (3am Pacific)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # needed to start the deploy workflow

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build site (refreshes Scholar cache)
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bundle exec jekyll build

      - name: Commit updated Scholar cache
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add cache and data directories
          git add _cache/ _data/
          
          # Check if there are any staged changes
          if git diff --staged --quiet; then
            echo "No citation-related changes to commit."
          else
            echo "Changes detected, committing..."
            git commit -m "chore: refresh Google Scholar cache"
            git push
            echo "Successfully committed and pushed changes."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly
      - name: Redeploy site with the new data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"